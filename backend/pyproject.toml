[project]
name = "policy-poster"
version = "0.1.0"
description = "Policy-to-Poster agentic platform — core pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "spacy>=3.7",
    "lancedb>=0.15",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "anthropic>=0.40",
    "python-pptx>=1.0.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "python-multipart>=0.0.32",
    "playwright>=1.62.0",
    "fastembed>=0.8.0",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_poster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
